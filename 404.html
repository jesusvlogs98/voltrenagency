<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found · Voltren Agency</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --white:#F8F9FB; --mid-gray:#7A8899; --black:#0A0E14; --blue:#1A6CFF; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--black); color:var(--white); font-family:'DM Sans',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px; overflow:hidden; position:relative; }
  .glow{ position:absolute; top:30%; left:50%; width:600px; height:600px; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(26,108,255,0.18), transparent 70%); pointer-events:none; }
  .bolt{ width:56px; height:56px; margin-bottom:28px; }
  .code{ font-family:'Bebas Neue',sans-serif; font-size:clamp(120px,26vw,220px); line-height:.9;
    letter-spacing:4px; color:var(--white); }
  .code span{ color:var(--blue); }
  h1{ font-family:'Bebas Neue',sans-serif; font-size:clamp(28px,6vw,44px); letter-spacing:2px;
    margin:8px 0 14px; }
  p{ color:var(--mid-gray); max-width:440px; margin-bottom:32px; line-height:1.6; }
  .actions{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  a.btn{ font-family:'Space Mono',monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase;
    text-decoration:none; padding:14px 26px; border:1px solid rgba(255,255,255,0.18); color:var(--white);
    transition:border-color .2s,background .2s; }
  a.btn:hover{ border-color:var(--blue); }
  a.btn.primary{ background:var(--blue); border-color:var(--blue); }
  a.btn.primary:hover{ background:#0A3B99; }
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="bolt" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="4,8 20,8 32,40 44,8 60,8 36,56 28,56" fill="#1A6CFF"/>
  </svg>
  <div class="code">4<span>0</span>4</div>
  <h1>PAGE NOT FOUND</h1>
  <p>The page you're looking for doesn't exist or has moved. Let's get you back on track. / Esta página no existe o fue movida.</p>
  <div class="actions">
    <a class="btn primary" href="/">Back to Home</a>
    <a class="btn" href="/es/">Ir al Inicio (ES)</a>
    <a class="btn" href="/audit.html">Free Audit</a>
  </div>
</body>
</html>
